# One Render web service serves the existing website files and the Python API.
# Free plan: no persistent disk, so saved demo decisions reset whenever the
# service restarts, redeploys, or spins down after inactivity.
services:
  - type: web
    name: groot-prototype
    runtime: python
    plan: free
    region: oregon
    rootDir: "Groot standalone UI-handoff/groot-standalone-ui/project"
    buildCommand: python -m compileall -q backend
    startCommand: python backend/app.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: GROOT_HOST
        value: 0.0.0.0
      # Outside the served project folder so the database is not downloadable.
      - key: GROOT_DB
        value: /tmp/groot-demo.sqlite3
